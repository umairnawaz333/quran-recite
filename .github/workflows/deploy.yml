name: Deploy to Vercel

# Manual trigger only — nothing deploys on push.
# Run it from the Actions tab, or with:  gh workflow run deploy.yml
on:
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        default: production
        options:
          - production
          - preview
      skip_tests:
        description: Deploy even if tests fail (emergency only)
        type: boolean
        default: false

# Two deploys racing each other would be worse than waiting.
concurrency:
  group: vercel-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Check out the ref being deployed
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs before the build so a broken commit never reaches production.
      # The suite covers the word-timing normalizer, the sync engine, the
      # timeline, and the audio playlist — the parts that silently corrupt
      # the reading experience when they regress.
      - name: Run tests
        if: ${{ !inputs.skip_tests }}
        run: npm test

      - name: Type check
        if: ${{ !inputs.skip_tests }}
        run: npm run typecheck

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # The app lives in apps/web, so the Vercel project's rootDirectory must
      # say so — it is what tells the cloud build where to install and build.
      # That setting lives in the project, not the repo, so nothing in a diff
      # reveals it and a wrong value fails only at deploy time. Read it and
      # refuse up front rather than discovering it from a broken deployment.
      - name: Check the Vercel project's root directory
        run: |
          expected=apps/web
          actual=$(curl -sf \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("rootDirectory") or "")')

          echo "rootDirectory: '${actual}' (expected '${expected}')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::The Vercel project's rootDirectory is '${actual}', not '${expected}'."
            echo "::error::Set it in Project Settings -> Build and Deployment -> Root Directory,"
            echo "::error::or with: curl -X PATCH -H \"Authorization: Bearer \$VERCEL_TOKEN\" \\"
            echo "::error::  -H 'Content-Type: application/json' -d '{\"rootDirectory\":\"apps/web\"}' \\"
            echo "::error::  \"https://api.vercel.com/v9/projects/\$VERCEL_PROJECT_ID?teamId=\$VERCEL_ORG_ID\""
            exit 1
          fi

      # The CLI does not reliably pick up the project link from the
      # VERCEL_ORG_ID / VERCEL_PROJECT_ID environment variables alone — it
      # errors with "Could not retrieve Project Settings". Writing the link
      # file it actually reads is deterministic.
      #
      # This step, and every other Vercel CLI step below, deliberately run
      # from the repository root and must not gain a `working-directory:
      # apps/web`. The project's `rootDirectory` (apps/web) is resolved by
      # the CLI as `join(cwd, rootDirectory)` — running from apps/web would
      # make it look for apps/web/apps/web and fail. Separately, a
      # non-prebuilt `vercel deploy` uploads the working directory tree, and
      # that tree must contain the whole workspace (root package.json,
      # package-lock.json, packages/core) for `"@quran/core": "*"` to
      # resolve during the cloud install. Running from apps/web breaks both.
      - name: Link the Vercel project
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<JSON
          {
            "projectId": "${{ secrets.VERCEL_PROJECT_ID }}",
            "orgId": "${{ secrets.VERCEL_ORG_ID }}"
          }
          JSON

      # Pulls the project's build settings and environment from Vercel so the
      # build here matches the build Vercel would have run itself.
      - name: Pull Vercel environment
        run: |
          vercel pull --yes \
            --environment=${{ inputs.target }} \
            --token=${{ secrets.VERCEL_TOKEN }}

      # Deliberately NOT using `vercel build` + `--prebuilt`. That path is
      # appealing — it ships the exact artifact CI tested — but for this
      # project's `output: 'export'` Next config it produced a deployment
      # that returned 404 on every route, including the home page. Uploading
      # the source and letting Vercel build is what actually works.
      #
      # The test gate above still protects production; Vercel simply rebuilds
      # the same commit that just passed.
      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy \
            ${{ inputs.target == 'production' && '--prod' || '' }} \
            --yes \
            --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"

      # A deploy that reports success while serving a broken page is worse
      # than a failed deploy, so check real content rather than just a 200.
      # This is not theoretical: a `--prebuilt` deploy once shipped a build
      # that 404'd on every route, and this step is what caught it.
      - name: Verify the deployment actually works
        id: verify
        run: |
          url="${{ steps.deploy.outputs.url }}"

          code=$(curl -s -o /dev/null -w '%{http_code}' "$url/")
          echo "home page: $code"
          [ "$code" = "200" ] || { echo "::error::Home page returned $code"; exit 1; }

          # grep -o then count lines: grep -c counts matching LINES, and the
          # exported HTML is one long line, so it would report 1 for any
          # number of words.
          words=$(curl -s "$url/surah/1/" | grep -o 'data-word-id' | wc -l | tr -d ' ')
          echo "Al-Fatihah word spans found: $words"
          [ "$words" -gt 0 ] || { echo "::error::Surah page rendered no words"; exit 1; }

          # Audio may be served from the deployment itself or from an external
          # origin (per-surah GitHub Releases), depending on whether
          # NEXT_PUBLIC_AUDIO_BASE_URL is configured. Check whichever origin
          # the build actually baked in — checking a fixed path would fail the
          # deploy the moment the audio moves, and pass while pointing at an
          # origin the app no longer uses.
          env_file=.vercel/.env.production.local
          base=$(grep -h '^NEXT_PUBLIC_AUDIO_BASE_URL=' "$env_file" 2>/dev/null \
                 | head -1 | cut -d= -f2- | tr -d '"'"'"'')

          if [ -n "$base" ]; then
            # Filename-only lookup, sharded per surah — mirrors resolveAudioUrl.
            audio_url="${base%/}/audio-001/001001.mp3"
            echo "audio origin: external ($base)"
          else
            audio_url="$url/audio/abdulbasit-murattal/001001.mp3"
            echo "audio origin: the deployment itself"
          fi

          audio=$(curl -sL -o /dev/null -w '%{http_code}' "$audio_url")
          echo "audio: $audio  ($audio_url)"
          [ "$audio" = "200" ] || { echo "::error::Audio returned $audio from $audio_url"; exit 1; }

          font=$(curl -s -o /dev/null -w '%{http_code}' "$url/fonts/amiri-quran.woff2")
          echo "font: $font"
          [ "$font" = "200" ] || { echo "::error::Font returned $font"; exit 1; }

          # resolveAudioUrl runs in the browser at play time, so
          # NEXT_PUBLIC_AUDIO_BASE_URL has to be inlined into a client chunk —
          # being present during the prerender is not enough. That inlining is
          # newly load-bearing now that resolveAudioUrl lives in @quran/core
          # and reaches the bundle through transpilePackages. Without this
          # check a deploy where it silently failed to inline would still pass
          # every assertion above, and audio would be broken for every user.
          if [ -n "$base" ]; then
            # Match the whole configured base, not just its host, and match it
            # literally. Matching the host alone does not discriminate: a
            # bundled dependency's licence URL already puts "github.com" in a
            # chunk, so that check passed on a build where the variable was
            # never set — it would have green-lit exactly the broken deploy it
            # exists to catch. Verified locally against both builds.
            needle="${base%/}"
            # Match only path-safe characters, not [^"]*: the chunk paths also
            # appear inside Next's flight payload where quoting differs, and a
            # greedy negated-quote class runs past the filename and yields a
            # mangled match that silently misses the chunk we need.
            chunks=$(curl -s "$url/" \
              | grep -o '/_next/static/chunks/[A-Za-z0-9._-]*\.js' | sort -u)

            if [ -z "$chunks" ]; then
              echo "::error::Found no client chunks on the home page"
              exit 1
            fi

            # Read line by line rather than iterating an unquoted expansion,
            # which depends on word-splitting the shell may not do.
            found=no
            while IFS= read -r chunk; do
              [ -n "$chunk" ] || continue
              if curl -s "$url$chunk" | grep -Fq "$needle"; then
                echo "audio base inlined in: $chunk"
                found=yes
                break
              fi
            done <<CHUNKS
          $chunks
          CHUNKS

            [ "$found" = "yes" ] || {
              echo "::error::'$needle' appears in no client chunk — the audio base URL did not inline, so audio playback would fail in the browser"
              exit 1
            }
          fi

      # If a production deploy went out but failed verification, put the
      # previous working deployment back immediately rather than leaving a
      # broken site up while someone reads the logs.
      - name: Roll back a failed production deploy
        if: failure() && inputs.target == 'production' && steps.deploy.outcome == 'success'
        run: |
          echo "::warning::Verification failed — rolling back to the previous production deployment"
          vercel rollback --yes --token=${{ secrets.VERCEL_TOKEN }}

          sleep 10
          code=$(curl -s -o /dev/null -w '%{http_code}' https://quran-recite-eta.vercel.app/)
          echo "site after rollback: $code"
          [ "$code" = "200" ] || echo "::error::Rollback did not restore the site — needs manual attention"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Deploy — ${{ inputs.target }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| URL | ${{ steps.deploy.outputs.url }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Ref | \`${{ github.ref_name }}\` |"
            echo "| Tests | ${{ inputs.skip_tests && 'SKIPPED' || 'passed' }} |"
            echo "| Result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
